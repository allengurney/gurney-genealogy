<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Fact sheet hero placeholder</title>
<desc id="desc">Reusable placeholder for ancestor fact-sheet hero images.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8f3ec"/>
    <stop offset="100%" stop-color="#efe4d4"/>
  </linearGradient>
</defs>
<rect width="1200" height="780" fill="url(#bg)"/>
<rect x="44" y="44" width="1112" height="692" rx="18" fill="#fffdfa" stroke="#d8cdbd" stroke-width="3"/>
<path d="M120 610 L260 250 L420 500 L560 190 L710 460 L880 270 L1020 610" fill="none" stroke="#8a6134" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
<text x="600" y="315" text-anchor="middle" font-family="Georgia,serif" font-size="66" fill="#1f2d44">Hero image placeholder</text>
<text x="600" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#8a6134">Replace with a stable local image asset before publication</text>
</svg>