name: Place normalization v1

# Trigger Europe-focused cleanup pass after the lightweight place model work.
on:
  push:
    branches:
      - place-normalization-v1-2026-04-17

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Europe cleanup pass
        run: python tools/refine_europe_places_pass3.py

      - name: Run Harpham structured cleanup
        run: python tools/reconcile_harpham_cleanup.py

      - name: Commit generated outputs
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data research/places research/log
          git commit -m "place normalization pass 3: clean England and Europe records"
          git push
