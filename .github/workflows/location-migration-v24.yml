name: Location migration v24

# Touch commit to trigger workflow after definition is present on branch.
on:
  push:
    branches:
      - location-migration-v24-2026-04-16

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run location extraction
        run: python tools/migrate_locations_v23_to_v24.py

      - name: Commit generated outputs
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/README.md "data/ancestors v24.json" data/locations.json research/places research/log
          git commit -m "location migration: extract v24 registry and place files"
          git push
